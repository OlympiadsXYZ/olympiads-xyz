name: Build Tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js 20.x
        uses: actions/setup-node@v1
        with:
          node-version: 20.x
      - uses: dart-lang/setup-dart@v1

      - name: Cache node modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/yarn.lock') }}

      - run: yarn
      - name: Check archive file links
        run: node --test scripts/tests/archive-links.test.mjs
      - run: npx gatsby build
        env:
          GATSBY_ARCHIVE_ENABLED: "true"
          GATSBY_ARCHIVE_BASE_URL: https://pub-43290baaaff14857b5dd59610ea438c7.r2.dev
          SITE_URL: https://olympiads-xyz.vercel.app
          GATSBY_CPU_COUNT: "3"
          GATSBY_VERBOSE_LOGGING: "2"
          NODE_OPTIONS: --max-old-space-size=10240
      - run: ./node_modules/.bin/serve public &
      - run: dart pub global activate linkcheck

      - name: Check Links
        run: $HOME/.pub-cache/bin/linkcheck --no-nice :5000

      - name: Bundle Watch
        run: yarn bundlewatch ./public/*.js
        env:
          BUNDLEWATCH_GITHUB_TOKEN: ${{ secrets.BUNDLEWATCH_GITHUB_TOKEN }}
          CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
