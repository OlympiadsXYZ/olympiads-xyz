# Builds the full site (archive enabled) on GitHub's runners — free for a public
# repo, 6-hour limit, 16 GB RAM — and publishes the finished output to the
# `deploy` branch. Vercel's git integration deploys that branch with its build
# step switched off (see the generated vercel.json), so the 8 GB / 45-minute
# Hobby builder never has to build Gatsby again. No Vercel token is involved:
# the only credential is the workflow's own GITHUB_TOKEN, used to push the
# branch inside this repository.
#
# Vercel project settings that make this work (Settings → Git):
#   Production Branch = deploy
#   Ignored Build Step = bash -c '[ "$VERCEL_GIT_COMMIT_REF" = "deploy" ] && exit 1 || exit 0'
# (exit 1 = build this commit, exit 0 = skip; so only `deploy` is ever deployed).
name: Build and publish to deploy branch

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-deploy
  cancel-in-progress: true   # always build the last thing

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile
      # Source gates (D-P8): nothing is built from invalid, non-normalised, stale
      # or ineligible problem sources. Any drift fails the job before Gatsby runs.
      - name: Install schema validator
        run: python3 -m pip install --user "$(grep -i '^jsonschema==' scripts/requirements-transcription.txt)"
      - name: Validate papers against schema
        run: python3 scripts/validate-papers.py
      - name: Normalisation drift check
        run: node scripts/normalise-papers.mjs --check
      - name: Generated pages and index are current
        run: node scripts/problems-to-site.mjs --check
      - name: Problems navigation is consistent
        run: node scripts/check-navigation.mjs
      - name: Generator tests
        run: node --test scripts/tests/problems.test.mjs scripts/tests/tx.test.mjs scripts/tests/gatsby-problem-nodes.test.mjs scripts/tests/navigation.test.mjs scripts/tests/figure-anchors.test.mjs scripts/tests/editor.test.mjs scripts/tests/publication-concurrency.test.mjs
      - name: Compile every solution MDX
        run: node scripts/check-mdx.mjs
      # Sourcing spikes the gatsby process to ~15 GB for about 30 s (seen 2026-09-23 at 1,093 papers; off-heap,
      # so NODE_OPTIONS does not cap it) and the 16 GB runner is killed. Swap absorbs the spike. 32 GB since 2026-09-23:
      # at 1,543 papers the 16 GB swap no longer held it and every Gatsby job was killed mid-build.
      - name: Add swap
        run: |
          df -h /mnt && sudo fallocate -l 32G /mnt/extra.swap && sudo chmod 600 /mnt/extra.swap
          sudo mkswap /mnt/extra.swap && sudo swapon /mnt/extra.swap && free -m
      - name: Build (archive on)
        timeout-minutes: 40
        env:
          GATSBY_ARCHIVE_ENABLED: "true"
          GATSBY_ARCHIVE_BASE_URL: https://pub-43290baaaff14857b5dd59610ea438c7.r2.dev
          SITE_URL: https://www.olympiads.xyz
          GATSBY_CPU_COUNT: "3"
          GATSBY_VERBOSE_LOGGING: "2"
          NODE_OPTIONS: --max-old-space-size=10240
          CI: "true"
        run: npx gatsby build
      - name: Assemble deploy tree
        run: |
          set -euo pipefail
          rm -rf out && mkdir out
          cp -r public out/public
          # Same redirects/rewrites as master, build step off, output = public/.
          jq '. + {"framework": null, "buildCommand": "", "installCommand": "", "outputDirectory": "public"}' vercel.json > out/vercel.json
          echo "Built from ${GITHUB_SHA} on $(date -u +%FT%TZ)" > out/BUILD.txt
          du -sh out/public
          # GitHub refuses files over 100 MB; fail loudly rather than push a broken branch.
          big=$(find out -type f -size +95M | head -5); if [ -n "$big" ]; then echo "files over 95 MB:"; echo "$big"; exit 1; fi
      - name: Push to deploy branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd out
          git init -q -b deploy
          git config user.name "olympiads-xyz build"
          git config user.email "build@olympiads.xyz"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Commit on top of the current deploy commit, so the push is a thin pack of what changed (deltas against
          # blobs the remote has). A fresh orphan commit re-sent the whole tree every time, and at ~3 GB of pages
          # (1,748 papers, 2026-09-23) the push failed against GitHub's 2 GB per-push limit.
          if git fetch -q --depth 1 "$remote" deploy; then git reset -q --soft FETCH_HEAD; fi
          git add -A
          git commit -q -m "Site build from ${GITHUB_SHA:0:9}: $(git -C .. log -1 --format=%s | cut -c1-72)"
          git push --force "$remote" deploy
