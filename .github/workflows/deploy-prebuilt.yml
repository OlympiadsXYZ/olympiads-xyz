# Builds the full site (archive enabled) on GitHub's runners — free for a public
# repo, 6-hour limit, 16 GB RAM — and deploys the prebuilt output to Vercel.
# Vercel Hobby's own builder has a 45-minute cap that the archive + transcribed
# problem pages exceed. Needs the repository secret VERCEL_TOKEN (Vercel →
# Account Settings → Tokens); until it exists the job exits early and Vercel's
# git integration keeps building as before.
name: Build and deploy (prebuilt)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prebuilt
  cancel-in-progress: true   # always build the last thing

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      VERCEL_ORG_ID: team_Ae3fCkgFGckm051xrK4vNtpa
      VERCEL_PROJECT_ID: prj_xgEh3BJRhWHxi06a1rJz4guOrZLM
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Skip until VERCEL_TOKEN is configured
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN secret not set — skipping prebuilt deploy" && exit 0
      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
          cache: yarn
      - name: Install
        if: env.VERCEL_TOKEN != ''
        run: yarn install --frozen-lockfile
      - name: Pull Vercel project settings and production env
        if: env.VERCEL_TOKEN != ''
        run: npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build (archive on, 3 workers)
        if: env.VERCEL_TOKEN != ''
        env:
          GATSBY_CPU_COUNT: 3
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt output
        if: env.VERCEL_TOKEN != ''
        run: npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
